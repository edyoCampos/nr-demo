name: exercise-3-prod

services:
  api:
    build:
      context: .
      target: prod
    ports:
      - "3001:3000"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
    depends_on:
      - db

  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_prod_data:/var/lib/postgresql/data

volumes:
  db_prod_data:
